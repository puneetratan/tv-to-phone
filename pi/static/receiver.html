<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>tv-to-phone receiver</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  #idle {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #444;
    font: 28px -apple-system, system-ui, sans-serif;
  }
  #frame {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: none;
  }
  #text {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    color: #eee;
    font: 48px -apple-system, system-ui, sans-serif;
    padding: 5%;
    text-align: center;
    box-sizing: border-box;
  }
</style>
</head>
<body>
  <div id="idle">Waiting for a cast&hellip;</div>
  <iframe id="frame"></iframe>
  <div id="text"></div>

<script>
// Persistent kiosk page. Never reloads -- see CLAUDE.md's "Decisions that
// must not be silently undone". Casts arrive over this WebSocket and mutate
// the DOM in place; a page navigation per cast would mean a white flash and
// nothing to synchronize an entry animation against once Stage 4 exists.
//
// Casted URLs render in an iframe. Sites sending X-Frame-Options or a
// restrictive frame-ancestors will render blank here -- that is a known
// Stage 1 limitation (see CLAUDE.md), not a bug in this page.

const idle = document.getElementById('idle');
const frame = document.getElementById('frame');
const text = document.getElementById('text');

function showIdle() {
  idle.style.display = 'flex';
  frame.style.display = 'none';
  frame.src = 'about:blank';
  text.style.display = 'none';
}

function showUrl(url) {
  idle.style.display = 'none';
  text.style.display = 'none';
  frame.src = url;
  frame.style.display = 'block';
}

function showText(value) {
  idle.style.display = 'none';
  frame.style.display = 'none';
  frame.src = 'about:blank';
  text.textContent = value;
  text.style.display = 'flex';
}

function handleCast(msg) {
  if (msg.url) {
    showUrl(msg.url);
  } else if (msg.text) {
    showText(msg.text);
  }
}

function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws`);

  ws.onmessage = (event) => {
    const msg = JSON.parse(event.data);
    if (msg.type === 'cast') handleCast(msg);
    if (msg.type === 'clear') showIdle();
  };

  // This page never navigates away, so a dropped connection has to retry in
  // place -- there is no reload to fall back on for recovering it.
  ws.onclose = () => setTimeout(connect, 1000);
  ws.onerror = () => ws.close();
}

connect();
</script>
</body>
</html>

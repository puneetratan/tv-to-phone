<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>tv-to-phone receiver</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  #idle {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #444;
    font: 28px -apple-system, system-ui, sans-serif;
  }
  #frame {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: none;
  }
  #photo {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: none;
  }
  #text {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    color: #eee;
    font: 48px -apple-system, system-ui, sans-serif;
    padding: 5%;
    text-align: center;
    box-sizing: border-box;
  }
</style>
</head>
<body>
  <div id="idle">Waiting for a cast&hellip;</div>
  <iframe id="frame" allow="autoplay; encrypted-media; picture-in-picture; fullscreen"></iframe>
  <img id="photo" alt="" />
  <div id="text"></div>

<script>
// Persistent kiosk page. Never reloads -- see CLAUDE.md's "Decisions that
// must not be silently undone". Casts arrive over this WebSocket and mutate
// the DOM in place; a page navigation per cast would mean a white flash and
// nothing to synchronize an entry animation against once Stage 4 exists.
//
// Casted URLs render in an iframe. Sites sending X-Frame-Options or a
// restrictive frame-ancestors will render blank here -- that is a known
// Stage 1 limitation (see CLAUDE.md), not a bug in this page.

const idle = document.getElementById('idle');
const frame = document.getElementById('frame');
const photo = document.getElementById('photo');
const text = document.getElementById('text');

const IMAGE_URL = /\.(jpe?g|png|gif|webp|bmp|avif)([?#]|$)/i;

// One view at a time. Blanking the frame and photo as well as hiding them
// stops a previous cast from playing or holding memory behind the new one.
function show(view) {
  idle.style.display = view === idle ? 'flex' : 'none';
  frame.style.display = view === frame ? 'block' : 'none';
  photo.style.display = view === photo ? 'block' : 'none';
  text.style.display = view === text ? 'flex' : 'none';
  if (view !== frame) frame.src = 'about:blank';
  if (view !== photo) photo.removeAttribute('src');
}

function showIdle() {
  show(idle);
}

function showUrl(url) {
  frame.src = url;
  show(frame);
}

// A raw image opened in an iframe is drawn at full pixel size, because
// Chrome only shrinks an image to fit in a top-level page. A phone photo
// would show as an enormous crop of its top-left corner, so images get an
// <img> that is scaled to fit the screen instead.
function showPhoto(url) {
  photo.src = url;
  show(photo);
}

function showText(value) {
  text.textContent = value;
  show(text);
}

function handleCast(msg) {
  if (msg.url && (msg.kind === 'image' || IMAGE_URL.test(msg.url))) {
    showPhoto(msg.url);
  } else if (msg.url) {
    showUrl(msg.url);
  } else if (msg.text) {
    showText(msg.text);
  }
}

function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws`);

  ws.onmessage = (event) => {
    const msg = JSON.parse(event.data);
    if (msg.type === 'cast') handleCast(msg);
    if (msg.type === 'clear') showIdle();
  };

  // This page never navigates away, so a dropped connection has to retry in
  // place -- there is no reload to fall back on for recovering it.
  ws.onclose = () => setTimeout(connect, 1000);
  ws.onerror = () => ws.close();
}

connect();
</script>
</body>
</html>
